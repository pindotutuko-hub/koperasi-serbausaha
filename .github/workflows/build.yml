name: Bangun Aplikasi (Windows + macOS)

# Membangun semua versi di server GitHub, tanpa perlu memasang apa pun
# di komputer sendiri.
#
# Cara menjalankan:
#   Buka tab Actions > pilih "Bangun Aplikasi (Windows + macOS)"
#   > klik "Run workflow". Tunggu 5-10 menit, lalu unduh di bagian Artifacts.
#
# Memberi tag vX.Y.Z pada commit akan membuat Release berisi semua berkas.

on:
  workflow_dispatch:
    inputs:
      rilis:
        description: 'Terbitkan juga sebagai Release dengan tag ini (kosongkan bila hanya ingin Artifacts)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ===================================================================== #
  windows:
    name: Windows (portable + installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pasang kebutuhan
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Bangun EXE
        run: pyinstaller KantinKoperasi.spec --noconfirm --clean

      - name: Susun folder portable
        shell: pwsh
        run: |
          $t = "PembukuanKantin-Portable-Windows"
          New-Item -ItemType Directory -Force -Path "$t/Data" | Out-Null
          Copy-Item dist/KantinKoperasi.exe $t/
          Copy-Item PANDUAN.md $t/ -ErrorAction SilentlyContinue
          Copy-Item contoh $t/contoh -Recurse -ErrorAction SilentlyContinue
          @"
          Penanda mode portable.

          Selama berkas ini (atau folder Data) ada di sebelah
          KantinKoperasi.exe, seluruh data pembukuan disimpan di folder
          Data, bukan di komputer yang dipakai.
          "@ | Set-Content "$t/portable.txt" -Encoding UTF8
          @"
          PROGRAM PEMBUKUAN KANTIN KOPERASI - VERSI PORTABLE
          ==================================================

          CARA PAKAI
            Klik dua kali KantinKoperasi.exe. Tidak perlu dipasang.

          DATA TERSIMPAN DI MANA
            Di folder Data, di sebelah program ini. Seluruh pembukuan ikut
            berpindah bila folder ini disalin ke flashdisk atau komputer
            lain. Komputer yang dipakai tidak ditulisi apa pun.

          PERINGATAN WINDOWS SAAT PERTAMA DIBUKA
            Bila muncul "Windows protected your PC", klik More info lalu
            Run anyway. Itu karena program belum bersertifikat digital,
            bukan karena berisi virus.

          JANGAN LUPA MENCADANGKAN
            Flashdisk mudah hilang atau rusak. Sesekali salin seluruh
            folder Data ke komputer atau penyimpanan awan.

          Panduan lengkap ada di berkas PANDUAN.md
          "@ | Set-Content "$t/BACA SAYA.txt" -Encoding UTF8
          Compress-Archive -Path $t -DestinationPath "$t.zip" -Force

      - name: Pasang Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Bangun Installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: Windows-Portable
          path: PembukuanKantin-Portable-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Windows-Installer
          path: installer_output/*.exe

      # Tiap job menerbitkan berkasnya sendiri, jadi job yang masih mengantre
      # (runner macOS Intel sering langka) tidak menahan yang sudah selesai.
      - name: Terbitkan ke Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.rilis != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.rilis || github.ref_name }}
          name: Program Pembukuan Kantin Koperasi ${{ inputs.rilis || github.ref_name }}
          files: |
            PembukuanKantin-Portable-Windows.zip
            installer_output/*.exe
          body: |
            ## Program Pembukuan Kantin Koperasi

            | Berkas | Untuk siapa |
            |--------|-------------|
            | `PembukuanKantin-Portable-Windows.zip` | Windows — jalan dari flashdisk, tanpa dipasang |
            | `KantinKoperasi_Setup_*.exe` | Windows — dipasang seperti aplikasi biasa |
            | `PembukuanKantin-Portable-macOS-AppleSilicon.zip` | Mac M1/M2/M3/M4 — portable |
            | `PembukuanKantin-Portable-macOS-Intel.zip` | Mac Intel — portable |
            | `KantinKoperasi-macOS-*.dmg` | Mac — dipasang ke folder Applications |

            **Mac, membuka pertama kali:** klik kanan aplikasi → Open → Open.
            **Windows, membuka pertama kali:** More info → Run anyway.

            Keduanya muncul karena aplikasi belum bersertifikat digital
            berbayar, bukan karena berisi virus.

            Berkas Mac Intel menyusul bila runner-nya sudah tersedia.

  # ===================================================================== #
  macos:
    name: macOS (${{ matrix.arsitektur }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14        # Apple Silicon (M1/M2/M3/M4)
            arsitektur: AppleSilicon
          - runner: macos-13        # Intel
            arsitektur: Intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pasang kebutuhan
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Bangun aplikasi
        run: pyinstaller KantinKoperasi.spec --noconfirm --clean

      - name: Tanda tangan ad-hoc
        run: codesign --force --deep --sign - dist/KantinKoperasi.app || true

      - name: Susun folder portable
        run: |
          t="PembukuanKantin-Portable-macOS-${{ matrix.arsitektur }}"
          mkdir -p "$t/Data"
          cp -R dist/KantinKoperasi.app "$t/"
          cp -f PANDUAN.md "$t/" || true
          cp -Rf contoh "$t/contoh" || true
          cat > "$t/portable.txt" <<'EOF'
          Penanda mode portable.

          Selama berkas ini (atau folder Data) ada di sebelah
          KantinKoperasi.app, seluruh data pembukuan disimpan di folder
          Data, bukan di komputer yang dipakai.
          EOF
          cat > "$t/BACA SAYA.txt" <<'EOF'
          PROGRAM PEMBUKUAN KANTIN KOPERASI - VERSI PORTABLE (macOS)
          ==========================================================

          CARA MEMBUKA PERTAMA KALI
            Klik KANAN pada KantinKoperasi.app, pilih Open, lalu tekan
            Open sekali lagi pada kotak peringatan. Cukup sekali saja;
            berikutnya bisa dibuka dengan klik dua kali biasa.

            Peringatan itu muncul karena aplikasi belum didaftarkan ke
            Apple (berbayar), bukan karena berisi virus.

          DATA TERSIMPAN DI MANA
            Di folder Data, di sebelah aplikasi ini. Seluruh pembukuan
            ikut berpindah bila folder ini disalin ke flashdisk atau
            komputer lain.

          JANGAN LUPA MENCADANGKAN
            Sesekali salin seluruh folder Data ke tempat lain.

          Panduan lengkap ada di berkas PANDUAN.md
          EOF
          # Simpan sebagai zip agar izin eksekusi di dalam .app tidak hilang
          ditto -c -k --sequesterRsrc --keepParent "$t" "$t.zip"

      - name: Buat DMG
        # Runner macOS kadang menjawab "Resource busy" karena Spotlight masih
        # memegang folder sumber. Karena itu: staging di dalam workspace,
        # nama volume unik per arsitektur, dan diulang beberapa kali.
        # Bila tetap gagal, langkah ini tidak menggagalkan job — versi ZIP
        # portable sudah berisi aplikasi yang sama.
        continue-on-error: true
        run: |
          staging="dmg-staging"
          volume="Pembukuan Kantin (${{ matrix.arsitektur }})"
          nama="KantinKoperasi-macOS-${{ matrix.arsitektur }}.dmg"

          rm -rf "$staging"; mkdir -p "$staging"
          cp -R dist/KantinKoperasi.app "$staging/"
          ln -s /Applications "$staging/Applications"
          cp -f PANDUAN.md "$staging/" || true
          # Jangan biarkan Spotlight mengindeks folder sumber
          mdutil -i off "$PWD" >/dev/null 2>&1 || true
          sync

          for percobaan in 1 2 3; do
            rm -f "$nama"
            hdiutil detach "/Volumes/$volume" -force >/dev/null 2>&1 || true
            if hdiutil create -volname "$volume" -srcfolder "$staging" \
                 -ov -format UDZO -fs HFS+ "$nama"; then
              echo "DMG berhasil dibuat pada percobaan ke-$percobaan."
              exit 0
            fi
            echo "Percobaan ke-$percobaan gagal; menunggu 15 detik lalu mengulang."
            sleep 15
          done

          echo "::warning::DMG tidak dapat dibuat di runner ini. Versi portable (.zip) berisi aplikasi yang sama dan tetap tersedia."
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: macOS-Portable-${{ matrix.arsitektur }}
          path: PembukuanKantin-Portable-macOS-${{ matrix.arsitektur }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macOS-DMG-${{ matrix.arsitektur }}
          path: KantinKoperasi-macOS-${{ matrix.arsitektur }}.dmg
          if-no-files-found: warn

      - name: Terbitkan ke Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.rilis != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.rilis || github.ref_name }}
          name: Program Pembukuan Kantin Koperasi ${{ inputs.rilis || github.ref_name }}
          files: |
            PembukuanKantin-Portable-macOS-${{ matrix.arsitektur }}.zip
            KantinKoperasi-macOS-${{ matrix.arsitektur }}.dmg
